<script>
const $ = id => document.getElementById(id);
let mode = 'search', img = null;
const TEXT_MODELS = ['gemini-3.8-flash', 'gemini-3.6-flash'], IMG_MODELS = ['gemini-nano-banana-2.1', 'gemini-2.5-flash-image'];

const API = 'https://gyaan-api.gitasinha419.workers.dev/';
$('cam').onclick = () => $('file').click();
$('rm').onclick = () => { img = null; $('preview').style.display = 'none'; $('file').value = ''; };

$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const url = r.result;
    img = { mime: f.type || 'image/jpeg', data: url.split(',')[1] };
    $('pimg').src = url; $('preview').style.display = 'flex';
  };
  r.readAsDataURL(f);
};

function setMode(m) {
  mode = m;
  $('mSearch').classList.toggle('on', m === 'search');
  $('mImage').classList.toggle('on', m === 'image');
  $('mTest').classList.toggle('on', m === 'test');
  $('mNotes').classList.toggle('on', m === 'notes');
  $('mCode').classList.toggle('on', m === 'code');
  $('codeopts').style.display = m === 'code' ? 'flex' : 'none';
  $('testopts').style.display = (m === 'test' || m === 'notes') ? 'flex' : 'none';
  $('imgopts').style.display = m === 'image' ? 'flex' : 'none';
  $('qtype').style.display = $('num').style.display = $('mins').style.display = m === 'test' ? '' : 'none';
  $('q').placeholder = m === 'search' ? 'Ask anything' : m === 'image' ? 'Describe the image you want' : m === 'test' ? 'Subject or chapter, e.g. Fractions' : m === 'code' ? (codeHist.length ? 'Reply, paste an error, or tap Next step' : 'Describe the code you want') : 'Chapter or topic, e.g. Photosynthesis';
  $('go').textContent = m === 'search' ? 'Search' : m === 'image' ? 'Create' : m === 'test' ? 'Start test' : m === 'code' ? 'Get code' : 'Make notes';
}
$('mSearch').onclick = () => setMode('search');
$('mImage').onclick = () => setMode('image');
$('mTest').onclick = () => setMode('test');
$('mNotes').onclick = () => setMode('notes');
$('mCode').onclick = () => setMode('code');
$('ovx').onclick = closeOv;
$('cfBtn').onclick = () => $('codefile').click();
$('cpBtn').onclick = () => { const t = $('codepaste'); t.style.display = t.style.display === 'none' ? 'block' : 'none'; if (t.style.display === 'block') t.focus(); };
$('codefile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > 100000) { $('cchip').textContent = 'That file is too big. The maximum is 100 KB.'; e.target.value = ''; return; }
  const r = new FileReader();
  r.onload = () => { codeFile = { name: f.name, text: String(r.result) }; $('cchip').textContent = 'File added: ' + f.name + '. Tap Get code to check it.'; };
  r.readAsText(f); e.target.value = '';
};
(() => { const u = navigator.userAgent; $('codedev').value = /iPhone|iPad/i.test(u) ? 'iPhone' : /Android/i.test(u) ? 'Android phone' : 'Laptop or computer'; fillApps(); })();
$('codedev').onchange = fillApps;
$('isvc').onchange = () => { if ($('isvc').value === 'puter') loadPuter().catch(() => {}); };
$('mHist').onclick = () => showHist();
$('mGames').onclick = () => showGames();
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
$('go').onclick = run;
$('q').addEventListener('input', renderSugg);
$('q').addEventListener('focus', renderSugg);
$('q').addEventListener('blur', () => setTimeout(() => { $('sugg').style.display = 'none'; }, 150));

function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function plain(s) {
  s = String(s);
  // put back backslashes that JSON turned into hidden control characters (\f \t \b \r \a \n)
  s = s.replace(/\x0c(?=rac|\{)/g, '\\f').replace(/\x0c(?=[a-z])/g, '\\f')
    .replace(/\t(?=imes|heta|ext|riangle|au\b|o\b)/g, '\\t')
    .replace(/\x08(?=eta|ar\b|inom)/g, '\\b')
    .replace(/\r(?=ight|ho\b)/g, '\\r')
    .replace(/\x07(?=lpha|ngle|pprox)/g, '\\a')
    .replace(/\n(?=eq\b)/g, '\\n');
  const B = '\\\\{1,2}';
  const sup = { 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹', '-': '⁻', '+': '⁺', n: 'ⁿ' };
  const toSup = t => t.split('').every(c => sup[c]) ? t.split('').map(c => sup[c]).join('') : '^(' + t + ')';
  const wrap = t => /^[A-Za-z0-9.\-]+$/.test(t) ? t : '(' + t + ')';
  s = s.replace(new RegExp(B + '[\\(\\[]|' + B + '[\\)\\]]', 'g'), '').replace(/\$\$?/g, '');
  for (let i = 0; i < 6; i++) {
    s = s.replace(new RegExp('(?:' + B + ')?[dt]?frac\\s*\\{([^{}]*)\\}\\s*\\{([^{}]*)\\}', 'g'), (m, a, b) => wrap(a.trim()) + '/' + wrap(b.trim()));
    s = s.replace(new RegExp(B + 'sqrt\\s*\\{([^{}]*)\\}', 'g'), (m, a) => '√' + wrap(a.trim()));
    s = s.replace(new RegExp(B + 'text(?:bf|rm)?\\s*\\{([^{}]*)\\}', 'g'), '$1');
    s = s.replace(/\^\{([^{}]*)\}/g, (m, a) => toSup(a)).replace(/_\{([^{}]*)\}/g, '_$1');
  }
  s = s.replace(new RegExp(B + '[dt]?frac\\s*([0-9])\\s*([0-9])', 'g'), '$1/$2');
  s = s.replace(new RegExp('\\^\\s*\\{?' + B + 'circ\\}?', 'g'), '°');
  s = s.replace(/\^([0-9])/g, (m, a) => sup[a]);
  const sym = { times: '×', div: '÷', cdot: '·', pm: '±', leq: '≤', le: '≤', geq: '≥', ge: '≥', neq: '≠', approx: '≈', pi: 'π', degree: '°', circ: '°', infty: '∞', theta: 'θ', alpha: 'α', beta: 'β', rightarrow: '→', to: '→', angle: '∠', triangle: '△' };
  s = s.replace(new RegExp(B + '([A-Za-z]+)', 'g'), (m, w) => w in sym ? sym[w] : (/^(left|right|displaystyle|quad|qquad|mathrm|mathbf)$/.test(w) ? '' : w));
  s = s.replace(new RegExp(B + '%', 'g'), '%').replace(new RegExp(B + '[,;:! ]', 'g'), ' ').replace(/[{}]/g, '');
  return s;
}
function deepPlain(v) {
  if (typeof v === 'string') return plain(v);
  if (Array.isArray(v)) return v.map(deepPlain);
  if (v && typeof v === 'object') { const o = {}; for (const k in v) o[k] = deepPlain(v[k]); return o; }
  return v;
}
function md(s) {
  return esc(plain(s)).replace(/^#{1,4}\s*(.+)$/gm, '<b>$1</b>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/^[*-] (.+)$/gm, '<li>$1</li>').replace(/<\/li>\n/g, '</li>');
}

async function call(model, body) {
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), body.tools ? 15000 : 20000);
  let res;
  try {
    res = await fetch(API + '?model=' + encodeURIComponent(model), {
      method: 'POST', signal: ctl.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  } catch (e) {
    clearTimeout(tm);
    if (e && e.name === 'AbortError') throw new Error('Request timed out. Gemini took too long to answer.');
    throw e;
  }
  let j = null, txt = '';
  try { txt = await res.text(); } catch (e) { clearTimeout(tm); throw new Error('Request timed out. Gemini took too long to answer.'); }
  clearTimeout(tm);
  try { j = JSON.parse(txt); } catch (e) {}
  if (!res.ok || !j) throw new Error((j && j.error && (j.error.message || j.error)) || ('Server problem (' + res.status + '): ' + (txt || 'empty reply').slice(0, 160)));
  if (j.error) throw new Error(j.error.message || String(j.error));
  return j;
}

async function wikiSearch(q) {
  try {
    const u = 'https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&list=search&srlimit=8&srsearch=' + encodeURIComponent(q);
    const d = await (await fetch(u)).json();
    return (d.query && d.query.search) || [];
  } catch (e) { return []; }
}

function loadPuter() {
  return new Promise((res, rej) => {
    if (window.puter) return res();
    const sc = document.createElement('script');
    sc.src = 'https://js.puter.com/v2/';
    sc.onload = res;
    sc.onerror = () => rej(new Error('Could not load Puter. Check your internet and try again.'));
    document.head.appendChild(sc);
  });
}
async function puterImage(q, rid) {
  const out = $('out');
  if (!q) { out.innerHTML = '<p class="err">Type what you want to see first.</p>'; return; }
  out.innerHTML = '<p class="msg">Opening Puter. If a sign-in window appears, log in or create a free account…</p>';
  try {
    if (!window.puter) await loadPuter();
    if (puter.auth && !puter.auth.isSignedIn()) await puter.auth.signIn();
    let im = null, lastErr;
    for (const opt of [{ model: 'gpt-image-1' }, { model: 'dall-e-3' }, null]) {
      try { im = opt ? await puter.ai.txt2img(q, opt) : await puter.ai.txt2img(q); break; } catch (e) { lastErr = e; }
    }
    if (!im) throw lastErr || new Error('No image came back.');
    if (rid !== runId) return;
    out.innerHTML = '<p class="msg">Made with Puter.</p>';
    im.style.maxWidth = '100%'; im.style.borderRadius = '12px'; im.alt = 'Generated image';
    out.appendChild(im);
    addRetry(0);
  } catch (e) {
    let m = '';

  if (x.type === 'short') {
    if (!x.answer) return null;
    return { type: 'short', question: x.question, answer: String(x.answer), explanation: x.explanation };
  }
  if (x.type === 'fill') {
    if (x.answer == null || x.answer === '') return null;
    return { type: 'fill', question: x.question, answer: String(x.answer), explanation: x.explanation };
  }
  if (Array.isArray(x.options) && typeof x.answer === 'number') return { type: 'mcq', question: x.question, options: x.options, answer: x.answer, explanation: x.explanation };
  return null;
}

function renderTest(qs, meta) {
  const out = $('out'), ans = {}, marks = {};
  let done = false, timeUp = false, auto = 0, saved = false;
  const shortN = qs.filter(q => q.type === 'short').length;
  out.innerHTML = (meta && meta.mins ? '<div id="timer"></div>' : '') + qs.map((q, i) => {
    let body;
    if (q.type === 'fill') body = '<input class="fillin" id="f' + i + '" type="text" placeholder="Type your answer" autocomplete="off">';
    else if (q.type === 'short') body = '<textarea class="fillin" id="f' + i + '" rows="3" placeholder="Write your answer"></textarea>';
    else body = q.options.map((o, j) => '<button class="opt" data-q="' + i + '" data-o="' + j + '">' + (q.type === 'tf' ? '' : 'ABCD'[j] + '. ') + esc(String(o)) + '</button>').join('');
    return '<div class="q"><p><b>' + (i + 1) + '. ' + esc(String(q.question)) + '</b></p>' + body + '<p class="why" id="why' + i + '"></p><div id="mk' + i + '"></div></div>';
  }).join('') + '<button class="go" id="sub">Submit answers</button><p id="score"></p>';
  out.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (done) return;
    const i = b.dataset.q; ans[i] = +b.dataset.o;
    out.querySelectorAll('.opt[data-q="' + i + '"]').forEach(x => x.classList.toggle('sel', x === b));
  });
  const update = () => {
    const got = auto + Object.values(marks).reduce((a, b) => a + b, 0);
    const pending = shortN - Object.keys(marks).length;
    $('score').textContent = (timeUp ? 'Time is up. ' : '') + 'Your score: ' + got + ' / ' + qs.length + (pending > 0 ? '. Mark your ' + pending + ' short ' + (pending > 1 ? 'answers' : 'answer') + ' above.' : '');
    if (meta) {
      saveHist({ sc: got, total: qs.length, level: meta.level, topic: meta.topic, date: new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) }, saved);
      saved = true;
    }
  };
  const clean = t => String(t).toLowerCase().replace(/[.\s]+$/, '').trim();
  const submit = () => {
    if (done) return;
    clearInterval(tmr); done = true;
    qs.forEach((q, i) => {
      if (q.type === 'fill') {
        const el = $('f' + i);
        const right = clean(el.value) === clean(q.answer);
        el.classList.add(right ? 'ok' : 'bad'); el.disabled = true;
        $('why' + i).textContent = (right ? '' : 'Answer: ' + q.answer + '. ') + (q.explanation || '');
        if (right) auto++;
      } else if (q.type === 'short') {
        $('f' + i).disabled = true;
        $('why' + i).textContent = 'Model answer: ' + q.answer + (q.explanation ? '. ' + q.explanation : '');
        const mk = $('mk' + i);
        mk.innerHTML = '<button class="mode" data-m="1">I got it right</button> <button class="mode" data-m="0">Not quite</button>';
        mk.querySelectorAll('button').forEach(b => b.onclick = () => {
          marks[i] = +b.dataset.m;
          mk.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
          update();
        });
      } else {
        out.querySelectorAll('.opt[data-q="' + i + '"]').forEach((b, j) => {
          if (j === q.answer) b.classList.add('ok'); else if (ans[i] === j) b.classList.add('bad');
        });
        $('why' + i).textContent = q.explanation || '';
        if (ans[i] === q.answer) auto++;
      }
    });
    update();
    $('sub').style.display = 'none';
    const t = $('timer'); if (t) t.style.display = 'none';
  };
  $('sub').onclick = submit;
  clearInterval(tmr);
  if (meta && meta.mins > 0) {
    let left = meta.mins * 60;
    const tick = () => {
      const el = $('timer');
      if (!el) { clearInterval(tmr); return; }
      el.textContent = 'Time left: ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
      if (left <= 0) { timeUp = true; submit(); return; }
      left--;
    };
    tick(); tmr = setInterval(tick, 1000);
  }
}

async function callImg(body) {
  let last;
  for (const m of IMG_MODELS) {
    try { return await call(m, body); }
    catch (e) { last = e; if (!/no longer available|not found|shut down|deprecated/i.test(e.message)) throw e; }
  }
  throw last;
}

async function callText(body) {
  let last;
  for (const m of TEXT_MODELS) {
    for (let a = 0; a < 2; a++) {
      try { return await call(m, body); }
      catch (e) {
        last = e;
        if (/high demand|overloaded|unavailable/i.test(e.message)) { if (a === 0) await new Promise(r => setTimeout(r, 1200)); continue; }
        if (/timed out/i.test(e.message) && body.tools) throw e;
        if (/quota|no longer available|not found|timed out/i.test(e.message)) break;
        throw e;
      }
    }
  }
  throw last;
}

async function run() {
  const q = $('q').value.trim();
  if (!q && !img && !(mode === 'code' && (codeFile || $('codepaste').value.trim()))) return;
  $('sugg').style.display = 'none';
  if (mode === 'search' && q && !img) {
    if (/^(games?|play games?)$/i.test(q)) { showGames(); return; }
    saveSearch(q);
    const site = siteFor(q);
    if (site) { window.location.href = site; return; }
  }
  const out = $('out');
  clearInterval(tmr);
  gameId++; window.onkeydown = window.onkeyup = null;
  const rid = ++runId;
  document.body.classList.add('has');
  if (mode === 'code') {
    $('go').disabled = true;
    const t = q || (codeFile || $('codepaste').value.trim() ? 'Please check this code for errors and fix it.' : 'Help me with the attached photo.');
    $('q').value = '';
    await codeTurn(t);
    $('go').disabled = false;
    return;
  }
  const lbl = mode === 'search' ? 'Searching' : mode === 'image' ? 'Creating your image' : mode === 'test' ? 'Preparing your test' : 'Writing your notes';
  out.innerHTML = '<p class="msg" id="pct" style="cursor:pointer"></p>';
  $('pct').onclick = openOv; prog.start(lbl);
  $('go').disabled = true;
  try {
    const parts = [];
    if (img) parts.push({ inline_data: { mime_type: img.mime, data: img.data } });
    parts.push({ text: q || 'Describe this image.' });

    if (mode === 'image' && $('isvc').value === 'puter') {
      await puterImage(q, rid);
    } else if (mode === 'search') {
      let j, grounded = true;
      try {
        j = await callText({ contents: [{ parts }], tools: [{ google_search: {} }] });
      } catch (e) {
        grounded = false;
        try { j = await callText({ contents: [{ parts }] }); }
        catch (e2) {
          const w = await wikiSearch(q);
          if (!w.length) throw e2;
          out.innerHTML = '<p class="msg">AI answer is unavailable (' + esc(e2.message.slice(0, 140)) + '). Showing web results instead.</p><div class="src">' + w.map(r =>
            '<a href="https://en.wikipedia.org/?curid=' + r.pageid + '" target="_blank" rel="noopener"><b>' + esc(r.title) + '</b><br>' + esc(r.snippet.replace(/<[^>]+>/g, '')) + '…</a>').join('') + '</div>';
          prog.finish(); $('go').disabled = false; return;
        }
      }
      const c = j.candidates && j.candidates[0];
      const text = c && c.content && c.content.parts ? c.content.parts.map(p => p.text || '').join('') : '';
      let html = '<div class="ans">' + md(text || 'No answer came back. Try rephrasing.') + '</div>';
      const chunks = (c && c.groundingMetadata && c.groundingMetadata.groundingChunks) || [];
      const seen = new Set(), links = [];
      chunks.forEach(g => { if (g.web && !seen.has(g.web.uri)) { seen.add(g.web.uri); links.push(g.web); } });
      if (links.length) {
        html += '<div class="src"><h2>Sources</h2>' + links.map(l =>
          '<a href="' + l.uri + '" target="_blank" rel="noopener">' + esc(l.title || l.uri) + '</a>').join('') + '</div>';
      }
      if (!grounded) html += '<p class="msg">Web sources aren’t available on your current Gemini plan, so this answer comes from the model alone.</p>';
      out.innerHTML = q ? '<div class="tabs"><button class="tab on" id="tAll">All</button><button class="tab" id="tImg">Images</button></div><div id="pAll">' + html + '</div><div id="pImg" style="display:none"></div>' : html;
      const pAll = $('pAll') || out;
      if (q) {
        let imgDone = false;
        $('tAll').onclick = () => { $('pAll').style.display = ''; $('pImg').style.display = 'none'; $('tAll').classList.add('on'); $('tImg').classList.remove('on'); };
        $('tImg').onclick = async () => {
          $('pAll').style.display = 'none'; $('pImg').style.display = ''; $('tImg').classList.add('on'); $('tAll').classList.remove('on');
          if (imgDone) return;
          $('pImg').innerHTML = '<p class="msg">Loading images…</p>';
          const list = await commonsImages(q);
          if (rid !== runId) return;
          imgDone = !!(list && list.length);
          $('pImg').innerHTML = list === null ? '<p class="err">Could not load images. Check your internet and try again.</p>'
            : !list.length ? '<p class="msg">No images found for this search.</p>'
            : '<div class="grid">' + list.map(p => '<a href="' + p.imageinfo[0].descriptionurl + '" target="_blank" rel="noopener"><img src="' + p.imageinfo[0].thumburl + '" alt="' + esc(p.title.replace(/^File:/, '')) + '" loading="lazy"></a>').join('') + '</div>';
        };
      }
      if (q) wikiImages(q).then(list => {
        if (rid !== runId || !list.length) return;
        pAll.insertAdjacentHTML('afterbegin', '<div class="pics">' + list.map(p =>
          '<a href="https://en.wikipedia.org/?curid=' + p.pageid + '" target="_blank" rel="noopener"><img src="' + p.thumbnail.source + '" alt="' + esc(p.title) + '" loading="lazy">' + esc(p.title) + '</a>').join('') + '</div>');
      });
    } else if (mode === 'image') {
      let j = null;
      try {
        j = await callImg({ contents: [{ parts }], generationConfig: { responseModalities: ['IMAGE', 'TEXT'] } });
      } catch (e) {
        if (!q || !/quota|billing|no longer available|not found/i.test(e.message)) throw e;
      }
      const ps = (j && j.candidates && j.candidates[0] && j.candidates[0].content.parts) || [];
      let html = '';
      ps.forEach(p => {
        const d = p.inlineData || p.inline_data;
        if (d) html += '<img alt="Generated image" src="data:' + (d.mimeType || d.mime_type) + ';base64,' + d.data + '">';
        else if (p.text) html += '<p class="ans">' + esc(p.text) + '</p>';
      });
      if (!j) await freeImage(q, rid);
      else { out.innerHTML = html || '<p class="msg">No image came back. Try a different description.</p>'; if (html) addRetry(0); }
    } else if (mode === 'test') {
      const total = Math.max(1, Math.min(100, parseInt($('num').value, 10) || 10));
      const level = $('cls').selectedOptions[0].text;
      const batches = Math.ceil(total / 25);
      let qs = [];
      for (let k = 0; k < batches; k++) {
        const n = Math.min(25, total - k * 25);
        out.innerHTML = '<p class="msg">Preparing your test… (' + qs.length + ' of ' + total + ' ready)</p>';
        const qt = $('qtype').value;
        const kinds = qt === 'mixed' ? 'a mix of multiple-choice, true or false, fill in the blank, and short answer questions' : { mcq: 'multiple-choice questions', tf: 'true or false questions', fill: 'fill in the blank questions', short: 'short-answer questions' }[qt];
        const prompt = 'Create ' + n + ' ' + kinds + ' for a student in ' + level + '. Subject or chapter: ' + (q || 'the attached photo') + '. Match the school level of that class exactly.' + (batches > 1 ? ' This is part ' + (k + 1) + ' of ' + batches + ', so cover different parts of the subject from the other parts.' : '') + ' Reply only with a JSON array. Each item is one of: {"type":"mcq","question":"...","options":["...","...","...","..."],"answer":0,"explanation":"one short sentence"} where answer is the index 0 to 3 of the one correct option; {"type":"tf","question":"a statement","answer":true,"explanation":"one short sentence"} where answer is true or false; {"type":"fill","question":"a sentence with ____ for the blank","answer":"the missing word or number","explanation":"one short sentence"}; {"type":"short","question":"...","answer":"a model answer in 1 to 2 sentences","explanation":"one short sentence"}. Use only the types requested. Write in the same language as the subject.';
        const tp = img ? [{ inline_data: { mime_type: img.mime, data: img.data } }, { text: prompt }] : [{ text: prompt }];
        try {
          const j = await callText({ contents: [{ parts: tp }], generationConfig: { responseMimeType: 'application/json' } });
          const c = j.candidates && j.candidates[0];
          const raw = (c && c.content && c.content.parts ? c.content.parts.map(p => p.text || '').join('') : '').replace(/```json|```/g, '').trim();
          let got; try { got = JSON.parse(raw); } catch (e) { try { got = JSON.parse(raw.replace(/\\(?![\\"\/bfnrtu])/g, '\\\\')); } catch (e2) { got = null; } }
          got = deepPlain(got);
          got = Array.isArray(got) ? got.map(normQ).filter(Boolean) : [];
          qs = qs.concat(got);
        } catch (e) { if (!qs.length) throw e; break; }
      }
      if (!qs.length) throw new Error('The test could not be made. Try again or use a simpler topic.');
      renderTest(qs, { level, topic: q || 'Photo', mins: parseInt($('mins').value, 10) || 0 });
      if (qs.length < total) out.insertAdjacentHTML('afterbegin', '<p class="msg">Only ' + qs.length + ' of ' + total + ' questions could be made this time. Try again later for the rest.</p>');
    } else {
      const level = $('cls').selectedOptions[0].text;
      const prompt = 'Write short, clear study notes for a student in ' + level + ' on: ' + (q || 'the attached photo') + '. Use simple language that fits that class. Start with a one-line overview, then 4 to 8 key points as lines starting with "- ", put key terms in **bold**, add one or two simple examples, and end with a 3-line summary. Write in the same language as the topic. Do not use markdown headings.';
      const np = img ? [{ inline_data: { mime_type: img.mime, data: img.data } }, { text: prompt }] : [{ text: prompt }];
      const text = await streamText({ contents: [{ parts: np }] }, t => { out.innerHTML = '<div class="ans">' + md(t) + '</div>'; });
      if (!text) out.innerHTML = '<p class="msg">No notes came back. Try again.</p>';
    }
  } catch (e) {
    let m = e.message;
    if (/failed to fetch|networkerror|load failed/i.test(m)) m = 'You seem to be offline. Search, tests and images need internet, but Games still work.';
    else if (/high demand|overloaded/i.test(m)) m = 'Google’s Gemini servers are busy right now. Wait a minute and tap the button again.';
    else if (/quota/i.test(m)) {
      const t = m.match(/retry in ([0-9hms]+)/i);
      m = 'Today’s free Gemini limit is used up' + (t ? '. It should reset in about ' + t[1].replace(/\.\d+s/, 's') : '') + '. Try again later, or turn on billing for your key in Google AI Studio.';
    }
    out.innerHTML = '<p class="err">' + esc(m) + '</p>';
  }
  prog.finish();
  $('go').disabled = false;
}
